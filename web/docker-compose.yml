services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: stock-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: stock-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend