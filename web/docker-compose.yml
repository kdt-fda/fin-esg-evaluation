services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: stock-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: stock-frontend
    ports:
      - "80:80"   
    depends_on:
      - backend