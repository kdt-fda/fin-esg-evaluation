services:
  # 크롤러
  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    image: fin-crawler-bot:latest
    container_name: stock-crawler-container
    restart: always
    env_file:
      - .env
    volumes:
      - ./model_cache:/app/model_cache
      - ./update_log.log:/app/update_log.log
    tty: true
    stdin_open: true

